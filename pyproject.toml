[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "retrofy"
version = "0.1.0"
description = "Evidence-bound local native game adaptation research"
requires-python = ">=3.9"
license = {text = "MIT"}
[project.scripts]
retrofy = "retrofy.cli:main"
[tool.setuptools]
packages = ["retrofy"]

[tool.setuptools.package-data]
retrofy = ["native/*.c", "native/*.h"]
